<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts macOS has, for anima2D.app's text. -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/anima2d-fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Helvetica Neue</family><family>Helvetica</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Times New Roman</family><family>Times</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Menlo</family><family>Courier New</family></prefer>
  </alias>
</fontconfig>
