# The tests, on GitHub: on Linux the server's suite, the web editor's type check, lint and
# specs, and the formatters (each a check of the flake); on macOS the desktop's unit spec
# and the UI test that drives the real window offscreen, its snapshots kept.
# The release workflow runs this first.
name: Test

on:
    # Branches only: a tag runs these through the release workflow.
    push:
        branches: ["**"]
    pull_request:
    workflow_call:

jobs:
    # Each check of the flake, built on its own so it shows as its own job.
    server:
        name: Server (Haskell suite)
        runs-on: ubuntu-latest
        timeout-minutes: 90

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install Nix
              uses: cachix/install-nix-action@v31

            - name: Server tests
              run: nix build -L --no-link .#checks.x86_64-linux.backend

    web:
        name: Web (type check, lint, specs)
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install Nix
              uses: cachix/install-nix-action@v31

            - name: Web tests
              run: nix build -L --no-link .#checks.x86_64-linux.web

    format:
        name: Formatting and lint (fourmolu, hlint, alejandra)
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install Nix
              uses: cachix/install-nix-action@v31

            - name: Formatters and linters
              run: nix build -L --no-link .#checks.x86_64-linux.pre-commit-check

    desktop:
        name: Desktop (unit and UI)
        runs-on: macos-15
        timeout-minutes: 120

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install Nix
              uses: cachix/install-nix-action@v31

            - name: Unit spec
              run: nix develop .#desktop -c cabal --project-file=cabal.project.desktop test anima2d-desktop:spec --test-show-details=direct

            - name: UI test
              run: nix develop .#desktop -c cabal --project-file=cabal.project.desktop test anima2d-desktop:ui --test-show-details=direct

            - name: Keep the UI snapshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ui-snapshots
                  path: desktop/ui-snapshots/*.png
                  if-no-files-found: ignore
